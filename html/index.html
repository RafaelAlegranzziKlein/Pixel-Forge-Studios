<!DOCTYPE html>
<html lang="pt-br">


<head>
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/cards.css">
    <link rel="stylesheet" href="../css/body.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Forge Studios</title>
</head>

<body>
    <header>
<ul>
    <li>Pixel Forge Studios</li>
    <li><img src="../assets/img/logoEscura.png" alt=""></li>
</ul>
    </header>

    <main>
        <div class="container-jogos">

            <div class="card">
                <img src="../assets/img/beer mine.png" class="logoJogo">
                <h3 class="tituloJogo russo-one-regular">Beer Miner</h3>
                <h2>Gênero: Simulação/RougueLike</h2>
                <button class="btn-ver-mais" data-titulo="Beer Miner" data-genero="Simulação/RougueLike"
                    data-desc="Explore minas perigosas em busca da cerveja perfeita neste jogo viciante!">
                    VER MAIS
                </button>
            </div>

            <div class="card">
                <img src="../assets/img/Acorn Colonies.png" class="logoJogo">
                <h3 class="tituloJogo russo-one-regular">Acorn Colonies</h3>
                <h2>Gênero: Simulação</h2>
                <button class="btn-ver-mais" data-titulo="Acorn Colonies" data-genero="Simulação"
                    data-desc="Gerencie sua própria colônia de esquilos e armazene o máximo de nozes para o inverno.">
                    VER MAIS
                </button>
            </div>

            <div class="card">
                <img src="../assets/img/Mechaanicaal oaths.png" class="logoJogo">
                <h3 class="tituloJogo russo-one-regular">Mechaanicaal</h3>
                <h2>Gênero: Factory / RougueLike</h2>
                <button class="btn-ver-mais" data-titulo="Mechaanicaal" data-genero="Factory / RougueLike"
                    data-desc="Lute contra hordas de robôs em um futuro distópico cheio de juramentos de aço.">
                    VER MAIS
                </button>
            </div>

            <div class="card">
                <img src="../assets/img/RougueBard.png" class="logoJogo">
                <h3 class="tituloJogo russo-one-regular">Rougue Bard</h3>
                <h2>Gênero: Rogue-like</h2>
                <button class="btn-ver-mais" data-titulo="Rougue Bard" data-genero="Rogue-like"
                    data-desc="Use o poder da música e da poesia para derrotar monstros em masmorras geradas proceduralmente.">
                    VER MAIS
                </button>
            </div>

        </div>

      <div id="gameModal" class="modal">
            <div class="modal-content">
                <span class="close-btn">&times;</span>
                <h2 id="modalGameTitle" class="russo-one-regular">Nome do Jogo</h2>
                <h4 id="modalGameGenre">Gênero</h4>
                <p id="modalGameDesc">Descrição do jogo...</p>
                </div>
        </div>
        </div>
    </main>
    <footer>

    </footer>
    <script src="../js/modal.js"></script>
</body>

</html>
